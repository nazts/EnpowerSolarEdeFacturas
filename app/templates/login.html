<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Enpower Solar</title>
<link rel="stylesheet" href="/static/bootstrap-icons/bootstrap-icons.min.css">

<style>
  :root{
    --bg:#F5F2E9; --card:#FCFAF5; --line:#D6CFBA; --txt:#2E4435; --muted:#566759;
    --accent:#2E4435; --on-accent:#F5F2E9; --bad:#A63A2B; --bad-bg:#F4DDD5;
    --focus:#C9A06A; --input-bg:#FFFFFF; --input-bd:#85806A; --bad-bd:#D9A397;
    --glow1:#E9E1C8; --glow2:#EFE9D6; --sombra:rgba(46,68,53,.14);
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
    font-family:"Segoe UI",system-ui,sans-serif;color:var(--txt);
    background:radial-gradient(1200px 600px at 20% -10%,var(--glow1) 0%,transparent 60%),
               radial-gradient(900px 500px at 110% 110%,var(--glow2) 0%,transparent 55%), var(--bg)}
  .caja{width:min(420px,92vw);background:var(--card);border:1px solid var(--line);
    border-radius:20px;padding:28px 26px;box-shadow:0 18px 48px var(--sombra)}
  .marca{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .logo{width:46px;height:46px;border-radius:14px;overflow:hidden;display:grid;place-items:center}
  .logo img{width:100%;height:100%;display:block;object-fit:contain}
  h1{margin:0;font-size:19px}
  .marca small{display:block;color:var(--muted);font-size:12px;font-weight:400}
  label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;
    color:var(--muted);margin:14px 0 6px}
  input{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--input-bd);
    background:var(--input-bg);color:var(--txt);font:inherit;min-height:44px}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}
  button{width:100%;margin-top:20px;padding:12px;border-radius:11px;border:1px solid var(--accent);
    background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;cursor:pointer;min-height:46px}
  button:hover{filter:brightness(1.05)}
  .error{margin-top:16px;padding:11px 13px;border-radius:10px;background:var(--bad-bg);
    color:var(--bad);font-size:13.5px;border:1px solid var(--bad-bd)}
  .pie{margin:18px 0 0;color:var(--muted);font-size:12px;text-align:center}
</style>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
</head>
<body>
  <form class="caja" method="post" action="/login">
    <div class="marca">
      <div class="logo"><img src="/static/logo-empresa.png" alt="Enpower Solar"></div>
      <div>
        <h1>Enpower Solar</h1>
        <small>Panel de clientes y facturas</small>
      </div>
    </div>

    <input type="hidden" name="next" value="{{ next }}">

    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" required autocomplete="username" autofocus
           value="{{ usuario_previo or '' }}">

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">

    <button type="submit">Entrar</button>

    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}

    <p class="pie">Acceso restringido al personal de Enpower Solar.</p>
  </form>
</body>
</html>
